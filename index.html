<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC App Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>BC App <span>Compare</span></h1>
      <p>Side-by-side diff of two Business Central .app packages</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="copyBtn" type="button">Copy summary</button>
      <button class="btn" id="csvBtn" type="button">Download CSV</button>
    </div>
  </header>

  <section class="slots" aria-label="Packages">
    <div class="slot" id="slotL" data-side="L"></div>
    <button class="swap" id="swapBtn" type="button" title="Swap left and right" aria-label="Swap left and right">⇄</button>
    <div class="slot" id="slotR" data-side="R"></div>
  </section>


  <main class="work">
    <aside class="side" aria-label="Objects">
      <div class="summary" id="summary"></div>
      <div class="searchbar"><input type="search" id="search" placeholder="Filter by name, ID or path" aria-label="Filter objects"></div>
      <div class="tree" id="tree"></div>
    </aside>
    <section class="view" id="view"></section>
  </main>
</div>
<input type="file" id="fileL" accept=".app" hidden>
<input type="file" id="fileR" accept=".app" hidden>
<input type="file" id="dirL" webkitdirectory hidden>
<input type="file" id="dirR" webkitdirectory hidden>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<!-- App scripts: classic scripts sharing one global scope, so order matters (works from file:// too) -->
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/package-reader.js"></script>
<script src="js/folder-reader.js"></script>
<script src="js/symbols.js"></script>
<script src="js/pairing.js"></script>
<script src="js/highlight.js"></script>
<script src="js/diff-engine.js"></script>
<script src="js/render/slots.js"></script>
<script src="js/render/tree.js"></script>
<script src="js/render/view.js"></script>
<script src="js/app.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
