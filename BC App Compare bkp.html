<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC App Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: compare workbench — two package slots on top, object tree on the left, aligned side-by-side diff on the right */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --panel-2:#eceff3; --line:#d7dde3; --fg:#18212b; --muted:#5b6774;
  --accent:#0e6a77; --accent-fg:#ffffff; --accent-soft:#dfeef0;
  --add:#1c7436; --add-bg:#e2f3e6; --add-strong:#afe0bb;
  --del:#b3261e; --del-bg:#fbe8e6; --del-strong:#f1b9b3;
  --mod:#9a5800; --mod-bg:#fcefd8;
  --same:#6f7b88; --same-bg:#e8ebef;
  --kw:#7b3aa0; --str:#a2410e; --com:#5b7a4b; --num:#0a6b96; --qid:#1d4f8c; --typ:#0e6a77;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Consolas, 'Cascadia Mono', monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#161d25; --panel-2:#1c252f; --line:#2b3642; --fg:#dce3eb; --muted:#8b97a5;
  --accent:#43b4c2; --accent-fg:#06161a; --accent-soft:#15333a;
  --add:#62cf82; --add-bg:#132d1c; --add-strong:#22512f;
  --del:#ff8b80; --del-bg:#371818; --del-strong:#682520;
  --mod:#f0b55c; --mod-bg:#36280f;
  --same:#8592a0; --same-bg:#222b35;
  --kw:#c99cf2; --str:#f0a172; --com:#819e74; --num:#6dc3e8; --qid:#90b9f2; --typ:#5fc9d3;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --panel-2:#1c252f; --line:#2b3642; --fg:#dce3eb; --muted:#8b97a5;
  --accent:#43b4c2; --accent-fg:#06161a; --accent-soft:#15333a;
  --add:#62cf82; --add-bg:#132d1c; --add-strong:#22512f;
  --del:#ff8b80; --del-bg:#371818; --del-strong:#682520;
  --mod:#f0b55c; --mod-bg:#36280f;
  --same:#8592a0; --same-bg:#222b35;
  --kw:#c99cf2; --str:#f0a172; --com:#819e74; --num:#6dc3e8; --qid:#90b9f2; --typ:#5fc9d3;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:10px;padding-inline:16px;padding-block:12px 14px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}

.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px}
.slot{border:1.5px dashed var(--line);border-radius:8px;background:var(--panel);padding:10px 14px;display:flex;gap:14px;align-items:center;min-width:0;transition:border-color .15s,background .15s}
.slot.filled{border-style:solid}
.slot.drag{border-color:var(--accent);background:var(--accent-soft)}
.slot .info{min-width:0;flex:1;display:grid;gap:1px}
.side-tag{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side-tag em{font-style:normal;color:var(--accent)}
.pkg-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg-name .ver{font:500 13px var(--mono);color:var(--accent);margin-left:6px}
.pkg-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg-err{font-size:12.5px;color:var(--del)}
.slot .acts{display:flex;gap:6px;flex:none}
.swap{align-self:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15px;display:grid;place-items:center}
.swap:hover{border-color:var(--accent)}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:7px 12px;font-size:13px}
.banner b{font-weight:600}

.work{display:grid;grid-template-columns:330px minmax(0,1fr);gap:10px;min-height:0}
.side,.view{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.view{min-width:0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.chip{border:0;border-right:1px solid var(--line);background:none;padding:7px 4px 6px;cursor:pointer;display:grid;justify-items:center;gap:0}
.chip:last-child{border-right:0}
.chip b{font:600 18px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.chip span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chip.added b{color:var(--add)} .chip.removed b{color:var(--del)} .chip.modified b{color:var(--mod)} .chip.same b{color:var(--same)}
.chip[aria-pressed="false"]{opacity:.38}
.chip:hover{background:var(--panel-2)}
.searchbar{padding:8px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:13px var(--sans)}
.tree{overflow:auto;flex:1;min-height:0;padding-bottom:8px}
.ghead{display:flex;align-items:center;gap:6px;width:100%;border:0;background:var(--panel-2);padding:5px 10px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;position:sticky;top:0;z-index:1;text-align:left}
.ghead .chev{display:inline-block;width:10px;transition:transform .15s}
.ghead.closed .chev{transform:rotate(-90deg)}
.ghead .cnt{margin-left:auto;font:500 11px var(--mono);letter-spacing:0;text-transform:none}
.row{display:grid;grid-template-columns:18px 50px minmax(0,1fr);gap:6px;align-items:center;width:100%;border:0;background:none;padding:3px 10px;text-align:left;cursor:pointer;font-size:13px}
.row.noid{grid-template-columns:18px minmax(0,1fr)}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .id{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.same .nm{color:var(--muted)}
.st{width:16px;height:16px;border-radius:3px;display:inline-grid;place-items:center;font:700 11px/1 var(--mono)}
.st.added{background:var(--add-bg);color:var(--add)} .st.removed{background:var(--del-bg);color:var(--del)}
.st.modified{background:var(--mod-bg);color:var(--mod)} .st.same{background:var(--same-bg);color:var(--same)}
.tree-empty{padding:20px 14px;color:var(--muted);font-size:13px}

.vhead{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.vhead h2{margin:0;font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.typebadge{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.vid{font:500 14px var(--mono);color:var(--muted)}
.pill{font-size:11.5px;padding:1px 9px;border-radius:10px;font-weight:600}
.pill.added{background:var(--add-bg);color:var(--add)} .pill.removed{background:var(--del-bg);color:var(--del)}
.pill.modified{background:var(--mod-bg);color:var(--mod)} .pill.same{background:var(--same-bg);color:var(--same)}
.note{font-size:12px;color:var(--mod)}
.paths{flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;font:11.5px var(--mono);color:var(--muted)}
.paths span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:4px 11px;border-radius:5px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.tab:disabled{opacity:.4;cursor:default}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{accent-color:var(--accent);margin:0}
.nav{display:flex;gap:4px;align-items:center;margin-left:auto}
.nav .btn{padding:3px 9px}
.counter{font:12px var(--mono);color:var(--muted);min-width:11ch;text-align:center;font-variant-numeric:tabular-nums}
.vbody{flex:1;min-height:0;display:flex}
.diffwrap{flex:1;overflow:auto;min-width:0}
.ruler{width:13px;position:relative;border-left:1px solid var(--line);background:var(--panel-2);flex:none}
.ruler i{position:absolute;left:2px;right:2px;min-height:3px;border-radius:1px;cursor:pointer}
.ruler i.del{background:var(--del)} .ruler i.add{background:var(--add)} .ruler i.chg{background:var(--mod)}
.struct{flex:1;overflow:auto;padding:12px 16px 20px;min-width:0}

table.diff{width:100%;border-collapse:collapse;table-layout:fixed;font:12.5px/1.55 var(--mono)}
table.diff col.ln{width:3.8em}
.diff td{vertical-align:top;padding:0 8px}
.diff td.ln{text-align:right;color:var(--muted);user-select:none;padding:0 7px 0 4px;font-variant-numeric:tabular-nums;background:var(--panel-2);font-size:11.5px}
.diff td.cd{white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere}
.diff td.cd.L{border-right:1px solid var(--line)}
.r-del td.cd.L,.r-chg td.cd.L{background:var(--del-bg)}
.r-add td.cd.R,.r-chg td.cd.R{background:var(--add-bg)}
.diff td.gap{background:repeating-linear-gradient(135deg,var(--panel-2) 0 5px,var(--panel) 5px 10px)}
.diff mark{color:inherit;border-radius:2px;padding:0}
.diff td.L mark{background:var(--del-strong)}
.diff td.R mark{background:var(--add-strong)}
.diff tr.cur td.ln{background:var(--accent);color:var(--accent-fg)}
.diff tr.fold td{padding:1px 8px;background:var(--panel-2);text-align:center;border-block:1px solid var(--line)}
.fold button{border:0;background:none;color:var(--accent);cursor:pointer;font:12px var(--sans);padding:2px 8px}
.fold button:hover{text-decoration:underline}
.k{color:var(--kw);font-weight:500} .s{color:var(--str)} .c{color:var(--com);font-style:italic} .n{color:var(--num)} .q{color:var(--qid)} .y{color:var(--typ)}

.msg{margin:auto;max-width:46ch;text-align:center;color:var(--muted);padding:28px 16px;display:grid;gap:8px;justify-items:center}
.msg h3{margin:0;color:var(--fg);font-size:16px;font-weight:600}
.msg p{margin:0}
.notice{padding:6px 12px;font-size:12.5px;background:var(--mod-bg);color:var(--mod)}

.struct h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 6px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.struct h3:first-child{margin-top:0}
.struct h3 small{text-transform:none;letter-spacing:0;font-weight:400}
.tw{overflow-x:auto}
table.sd{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.sd th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--line)}
.sd td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sd td.v{font:12px/1.5 var(--mono);overflow-wrap:anywhere;width:34%}
.sd td.it{font-weight:500;overflow-wrap:anywhere}
.sd tr.removed td.v.l{background:var(--del-bg)} .sd tr.added td.v.r{background:var(--add-bg)}
.sd tr.modified td.v.l{background:var(--del-bg)} .sd tr.modified td.v.r{background:var(--add-bg)}
.struct .ok{color:var(--muted);font-size:13px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}

@media (max-width:860px){
  .app{height:auto;display:flex;flex-direction:column}
  .slots{grid-template-columns:1fr}
  .swap{justify-self:center;transform:rotate(90deg)}
  .work{grid-template-columns:1fr}
  .side{max-height:46vh}
  .view{height:80vh}
  .paths{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>BC App <span>Compare</span></h1>
      <p>Side-by-side diff of two Business Central .app packages</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="copyBtn" type="button">Copy summary</button>
      <button class="btn" id="csvBtn" type="button">Download CSV</button>
    </div>
  </header>

  <section class="slots" aria-label="Packages">
    <div class="slot" id="slotL" data-side="L"></div>
    <button class="swap" id="swapBtn" type="button" title="Swap left and right" aria-label="Swap left and right">⇄</button>
    <div class="slot" id="slotR" data-side="R"></div>
  </section>

  <div class="banner" id="banner" hidden>
    <span>This is a built-in <b>example</b> (a fictional Customer Loyalty extension, v1.0 vs v1.1). Drop your own two <b>.app</b> files on the boxes above to compare them.</span>
  </div>

  <main class="work">
    <aside class="side" aria-label="Objects">
      <div class="summary" id="summary"></div>
      <div class="searchbar"><input type="search" id="search" placeholder="Filter by name, ID or path" aria-label="Filter objects"></div>
      <div class="tree" id="tree"></div>
    </aside>
    <section class="view" id="view"></section>
  </main>
</div>
<input type="file" id="fileL" accept=".app" hidden>
<input type="file" id="fileR" accept=".app" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- object types ---------- */
const TYPE_INFO = [
  ['table','Table','Tables'],['tableextension','Table extension','Table extensions'],
  ['page','Page','Pages'],['pageextension','Page extension','Page extensions'],['pagecustomization','Page customization','Page customizations'],
  ['codeunit','Codeunit','Codeunits'],['report','Report','Reports'],['reportextension','Report extension','Report extensions'],
  ['query','Query','Queries'],['xmlport','XmlPort','XmlPorts'],['enum','Enum','Enums'],['enumextension','Enum extension','Enum extensions'],
  ['interface','Interface','Interfaces'],['controladdin','Control add-in','Control add-ins'],
  ['permissionset','Permission set','Permission sets'],['permissionsetextension','Permission set extension','Permission set extensions'],
  ['profile','Profile','Profiles'],['profileextension','Profile extension','Profile extensions'],['entitlement','Entitlement','Entitlements'],
  ['other','AL file','Other AL files'],['file','File','Package files']
];
const TYPE = Object.fromEntries(TYPE_INFO.map((t, i) => [t[0], { order: i, one: t[1], many: t[2] }]));
const SYM_TYPES = {
  Tables:'table', TableExtensions:'tableextension', Pages:'page', PageExtensions:'pageextension', PageCustomizations:'pagecustomization',
  Codeunits:'codeunit', Reports:'report', ReportExtensions:'reportextension', Queries:'query', XmlPorts:'xmlport',
  EnumTypes:'enum', EnumExtensionTypes:'enumextension', Interfaces:'interface', ControlAddIns:'controladdin',
  PermissionSets:'permissionset', PermissionSetExtensions:'permissionsetextension', Profiles:'profile', ProfileExtensions:'profileextension', Entitlements:'entitlement'
};
const OBJ_RE = /^﻿?(tableextension|table|pageextension|pagecustomization|page|codeunit|reportextension|report|xmlport|query|enumextension|enum|interface|permissionsetextension|permissionset|controladdin|profileextension|profile|entitlement)\b[ \t]+(?:(\d+)[ \t]+)?("(?:[^"\r\n]|"")*"|[A-Za-z_]\w*)/gim;
const BIN_RE = /\.(zip|png|jpe?g|gif|bmp|ico|dll|exe|pdf|woff2?|ttf|otf|eot|navx|app|bin|mp4|svgz)$/i;
const STATUS = ['added','removed','modified','same'];
const GLYPH = { added:'+', removed:'−', modified:'≠', same:'=' };
const LABEL = { added:'Added', removed:'Removed', modified:'Modified', same:'Same' };

/* ---------- state ---------- */
const S = {
  L: null, R: null, sample: false, err: { L: '', R: '' }, busy: { L: false, R: false },
  pairs: [], sel: null, filter: { added: true, removed: true, modified: true, same: true }, q: '',
  closed: new Set(), opts: { ws: false, cs: false, fold: false }, tab: 'code', expanded: new Set(), block: -1, blocks: 0
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();

/* ---------- package reading ---------- */
function normPath(p) {
  let s = p;
  for (let k = 0; k < 4; k++) { try { const d = decodeURIComponent(s); if (d === s) break; s = d; } catch { break; } }
  return s.replace(/\\/g, '/');
}
const stripBom = t => t.charCodeAt(0) === 0xFEFF ? t.slice(1) : t;

async function readPackage(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let off = -1;
  for (let i = 0, n = Math.min(buf.length - 4, 8192); i < n; i++) {
    if (buf[i] === 0x50 && buf[i+1] === 0x4B && buf[i+2] === 3 && buf[i+3] === 4) { off = i; break; }
  }
  if (off < 0) throw new Error('No readable contents found. This may be a runtime package or an encrypted AppSource app.');
  const zip = await JSZip.loadAsync(buf.subarray(off));
  const files = [];
  for (const [p, e] of Object.entries(zip.files)) {
    if (e.dir) continue;
    const path = normPath(p);
    const bin = BIN_RE.test(path);
    files.push({ path, bin, data: bin ? await e.async('uint8array') : stripBom(await e.async('string')) });
  }
  return buildApp(file.name, files);
}

function parseManifest(xml) {
  const m = { attrs: {}, idRanges: [], deps: [], features: [], rep: {}, build: {} };
  if (!xml) return m;
  try {
    const d = new DOMParser().parseFromString(xml, 'application/xml');
    const attrsOf = el => el ? Object.fromEntries([...el.attributes].map(a => [a.name, a.value])) : {};
    m.attrs = attrsOf(d.getElementsByTagName('App')[0]);
    m.idRanges = [...d.getElementsByTagName('IdRange')].map(e => `${e.getAttribute('MinObjectId')}..${e.getAttribute('MaxObjectId')}`);
    m.deps = [...d.getElementsByTagName('Dependency')].map(attrsOf);
    m.features = [...d.getElementsByTagName('Feature')].map(e => e.textContent.trim());
    m.rep = attrsOf(d.getElementsByTagName('ResourceExposurePolicy')[0]);
    m.build = attrsOf(d.getElementsByTagName('Build')[0]);
  } catch {}
  return m;
}

function collectSymbols(node, out) {
  if (!node || typeof node !== 'object') return out;
  for (const [k, type] of Object.entries(SYM_TYPES)) {
    if (Array.isArray(node[k])) for (const s of node[k]) out.push({ type, sym: s });
  }
  if (Array.isArray(node.Namespaces)) for (const n of node.Namespaces) collectSymbols(n, out);
  return out;
}

function parseAlObjects(text, path) {
  const found = [];
  OBJ_RE.lastIndex = 0;
  let m;
  while ((m = OBJ_RE.exec(text))) {
    let name = m[3];
    if (name[0] === '"') name = name.slice(1, -1).replace(/""/g, '"');
    found.push({ index: m.index, type: m[1].toLowerCase(), id: m[2] ? +m[2] : null, name });
  }
  if (!found.length) return [{ type: 'other', id: null, name: path.split('/').pop(), text }];
  return found.map((f, i) => ({
    type: f.type, id: f.id, name: f.name,
    text: text.slice(i === 0 ? 0 : f.index, i + 1 < found.length ? found[i+1].index : text.length).replace(/\s+$/, '') + '\n'
  }));
}

function buildApp(fileName, files) {
  const byPath = new Map(files.map(f => [f.path.toLowerCase(), f]));
  const manifest = parseManifest(byPath.get('navxmanifest.xml')?.data);
  let symRoot = null;

/* ---------- pairing ---------- */
function normLine(l) {

const normText = t => t == null ? null : t.split(/\r?\n/).map(normLine).join('\n').replace(/\n+$/, '');

function pairApps(A, B) {

  const match = (la, ra, kind, keyFns) => {
    const used = new Set(); let pending = la.slice();
    for (const kf of keyFns) {

      ra.forEach((o, i) => { const k = kf(o); if (k != null && !used.has(i) && !idx.has(k)) idx.set(k, i); });
      const rest = [];

        if (i != null && !used.has(i)) { used.add(i); pairs.push(mk(o, ra[i], kind)); } else rest.push(o);

function paint(text, toks, marks) {

  const hasStruct = (p.kind === 'object' && (p.L?.sym || p.R?.sym)) || isManifest;
  if (!hasStruct && S.tab === 'struct') S.tab = 'code';

  if (p.L && p.R && p.L.id !== p.R.id && p.kind === 'object') notes.push(`ID changed ${p.L.id} → ${p.R.id}`);
  if ((p.L?.fromSymbols || p.R?.fromSymbols)) notes.push('No source in package: comparing symbol outline');

      <div class="paths"><span title="${p.L ? esc(p.L.path) : ''}">L: ${pth(p.L)}</span><span title="${p.R ? esc(p.R.path) : ''}">R: ${pth(p.R)}</span></div>
    </div>
    <div class="vtools">
      <div class="tabs" role="tablist">

        <button type="button" class="tab" role="tab" data-tab="struct" aria-selected="${S.tab === 'struct'}" ${hasStruct ? '' : 'disabled title="No symbol information for this item"'}>Structure</button>
      </div>

        <label class="toggle"><input type="checkbox" id="optFold" ${S.opts.fold ? 'checked' : ''}>Only changes</label>
        <label class="toggle"><input type="checkbox" id="optWs" ${S.opts.ws ? 'checked' : ''}>Ignore whitespace</label>
        <label class="toggle"><input type="checkbox" id="optCs" ${S.opts.cs ? 'checked' : ''}>Ignore case</label>
      </div>
      <div class="nav" ${S.tab === 'code' ? '' : 'hidden'}>
        <button class="btn" type="button" id="prevBtn" title="Previous change (P)">↑ Prev</button>
        <span class="counter" id="counter"></span>

}

function renderCode(p) {
  const body = $('vbody');
  S.block = -1; S.blocks = 0;
  if ((p.L && p.L.bin) || (p.R && p.R.bin)) {
    const sz = o => o ? `${o.bytes ? o.bytes.length.toLocaleString() : 0} bytes` : 'not present';
    body.innerHTML = `<div class="msg"><h3>Binary file</h3><p>Left: ${sz(p.L)}<br>Right: ${sz(p.R)}</p><p>${p.status === 'same' ? 'The two files are byte-for-byte identical.' : 'The files differ.'}</p></div>`;
    updateCounter(); return;
  }
  const A = p.L ? p.L.text.replace(/\n$/, '').split(/\r?\n/) : [];
  const B = p.R ? p.R.text.replace(/\n$/, '').split(/\r?\n/) : [];
  const { rows, blocks } = buildRows(A, B);
  S.blocks = blocks;
  const lang = langOf(p), big = A.length + B.length > 60000;
  const tA = big ? [] : tokenize(A, lang), tB = big ? [] : tokenize(B, lang);
  let fold = S.opts.fold;
  if (!fold && rows.length > 6000) { fold = true; $('notice').innerHTML = '<div class="notice">Large file: unchanged lines are collapsed.</div>'; }

  // decide which eq rows are hidden behind fold rows
  const CTX = 3, show = new Array(rows.length).fill(true);
  if (fold) {
    const near = new Array(rows.length).fill(false);
    rows.forEach((r, x) => { if (r.t !== 'eq') for (let d = -CTX; d <= CTX; d++) if (rows[x+d]) near[x+d] = true; });
    rows.forEach((r, x) => { if (r.t === 'eq' && !near[x]) show[x] = false; });
  }
  let html = '<table class="diff"><colgroup><col class="ln"><col><col class="ln"><col></colgroup><tbody>';
  for (let x = 0; x < rows.length; x++) {
    if (!show[x]) {
      let y = x; while (y < rows.length && !show[y]) y++;
      const key = p.i + ':' + x;
      if (S.expanded.has(key)) { for (let z = x; z < y; z++) show[z] = true; }
      else { html += `<tr class="fold"><td colspan="4"><button type="button" data-fold="${key}">⋯ ${y - x} unchanged line${y - x > 1 ? 's' : ''} · show</button></td></tr>`; x = y - 1; continue; }
    }
    const r = rows[x];
    let ml = null, mr = null;
    if (r.t === 'chg') [ml, mr] = intraline(A[r.l], B[r.r]);
    const lc = r.l != null ? `<td class="ln">${r.l + 1}</td><td class="cd L">${paint(A[r.l], tA[r.l], ml)}</td>` : '<td class="ln"></td><td class="cd L gap"></td>';
    const rc = r.r != null ? `<td class="ln">${r.r + 1}</td><td class="cd R">${paint(B[r.r], tB[r.r], mr)}</td>` : '<td class="ln"></td><td class="cd R gap"></td>';
    html += `<tr class="r-${r.t}"${r.b != null ? ` data-b="${r.b}"` : ''}>${lc}${rc}</tr>`;
  }
  html += '</tbody></table>';
  if (!A.length && !B.length) html = '<div class="msg"><p>Empty file.</p></div>';
  body.innerHTML = `<div class="diffwrap" id="diffwrap">${html}</div><div class="ruler" id="ruler" aria-hidden="true"></div>`;
  updateCounter();
  requestAnimationFrame(drawRuler);
}

function drawRuler() {
  const wrap = $('diffwrap'), ruler = $('ruler');
  if (!wrap || !ruler) return;
  const total = wrap.scrollHeight || 1; let html = '';
  for (let b = 0; b < S.blocks; b++) {
    const trs = wrap.querySelectorAll(`tr[data-b="${b}"]`); if (!trs.length) continue;
    const first = trs[0], last = trs[trs.length - 1];
    const top = first.offsetTop / total * 100, h = (last.offsetTop + last.offsetHeight - first.offsetTop) / total * 100;
    const kinds = new Set([...trs].map(t => t.className.slice(2)));
    const k = kinds.has('chg') || (kinds.has('del') && kinds.has('add')) ? 'chg' : kinds.has('del') ? 'del' : 'add';
    html += `<i class="${k}" data-goto="${b}" style="top:${top}%;height:${h}%"></i>`;
  }
  ruler.innerHTML = html;
}

function updateCounter() {
  const c = $('counter'); if (!c) return;
  c.textContent = !S.blocks ? 'No changes' : S.block < 0 ? `${S.blocks} change${S.blocks > 1 ? 's' : ''}` : `${S.block + 1} of ${S.blocks}`;
  $('prevBtn').disabled = !S.blocks; $('nextBtn').disabled = !S.blocks;
}
function goTo(b) {
  const wrap = $('diffwrap'); if (!wrap || !S.blocks) return;
  S.block = (b + S.blocks) % S.blocks;
  wrap.querySelectorAll('tr.cur').forEach(t => t.classList.remove('cur'));
  const trs = wrap.querySelectorAll(`tr[data-b="${S.block}"]`);
  trs.forEach(t => t.classList.add('cur'));
  if (trs[0]) wrap.scrollTo({ top: Math.max(0, trs[0].offsetTop - wrap.clientHeight / 3), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  updateCounter();
}

function renderStructure(p, isManifest) {
  const sections = isManifest ? manifestDiff(S.L.manifest, S.R.manifest) : structureDiff(p.L?.sym, p.R?.sym);
  const changed = sections.filter(s => s.rows.length);
  let html = '';
  if (!changed.length) html = `<p class="ok">No structural changes. ${sections.reduce((n, s) => n + s.same, 0)} members compared.</p>`;
  for (const s of changed) {
    html += `<h3>${esc(s.title)} <small>${s.rows.length} changed${s.same ? ` · ${s.same} unchanged` : ''}</small></h3>
      <div class="tw"><table class="sd"><thead><tr><th style="width:90px">Change</th><th>Item</th><th>Left</th><th>Right</th></tr></thead><tbody>` +
      s.rows.map(r => `<tr class="${r.st}"><td><span class="pill ${r.st}">${LABEL[r.st]}</span></td><td class="it">${esc(r.item)}</td><td class="v l">${esc(r.l)}</td><td class="v r">${esc(r.r)}</td></tr>`).join('') +
      '</tbody></table></div>';
  }
  $('vbody').innerHTML = `<div class="struct">${html}</div>`;
}
/* ---------- orchestration ---------- */
function recompute(keepSel) {
  const prev = keepSel && S.sel != null ? S.pairs[S.sel] : null;
  S.pairs = S.L && S.R ? pairApps(S.L, S.R) : [];
  computeStatuses();
  S.expanded.clear();
  if (prev) { const m = S.pairs.find(p => p.type === prev.type && p.name === prev.name); S.sel = m ? m.i : null; }
  if (S.sel == null || !S.pairs[S.sel]) { const f = S.pairs.find(p => p.status === 'modified') || S.pairs.find(p => p.status !== 'same') || S.pairs[0]; S.sel = f ? f.i : null; }
  renderAll();
}
function renderAll() {
  renderSlot('L'); renderSlot('R'); renderSummary(); renderTree(); renderView();
  $('banner').hidden = !S.sample;
  const none = !S.pairs.length;
  $('copyBtn').disabled = none; $('csvBtn').disabled = none;
}

async function loadFile(side, file) {
  if (S.sample) { S.sample = false; S.L = S.R = null; S.sel = null; }
  S.busy[side] = true; S.err[side] = ''; renderSlot(side);
  try { S[side] = await readPackage(file); }
  catch (e) { S[side] = null; S.err[side] = `${file.name}: ${e.message || e}`; }
  S.busy[side] = false;
  S.sel = null; recompute(false);
}
async function loadTwo(files) {
  if (S.sample) { S.sample = false; S.L = S.R = null; }
  S.busy.L = S.busy.R = true; S.err.L = S.err.R = ''; renderSlot('L'); renderSlot('R');
  const res = await Promise.all(files.slice(0, 2).map(f => readPackage(f).then(a => ({ a }), e => ({ e: `${f.name}: ${e.message || e}` }))));
  S.busy.L = S.busy.R = false;
  let [x, y] = res;
  if (x.a && y.a && verCmp(x.a.manifest.attrs.Version, y.a.manifest.attrs.Version) > 0) [x, y] = [y, x];
  S.L = x.a || null; S.err.L = x.e || ''; S.R = y.a || null; S.err.R = y.e || '';
  S.sel = null; recompute(false);
}

function summaryRows() {
  return S.pairs.map(p => [LABEL[p.status], TYPE[p.type].one, p.id ?? '', p.L && p.R && p.L.name !== p.R.name ? `${p.L.name} → ${p.R.name}` : p.name]);
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }

document.addEventListener('click', e => {

  if (!t) return;
  if (t.dataset.pick) $('file' + t.dataset.pick).click();
  else if (t.dataset.f) { S.filter[t.dataset.f] = !S.filter[t.dataset.f]; renderSummary(); renderTree(); }
  else if (t.dataset.g) { S.closed.has(t.dataset.g) ? S.closed.delete(t.dataset.g) : S.closed.add(t.dataset.g); renderTree(); }
  else if (t.dataset.i != null) { S.sel = +t.dataset.i; renderTree(); renderView(); }
  else if (t.dataset.tab) { if (!t.disabled) { S.tab = t.dataset.tab; renderView(); } }
  else if (t.dataset.fold) { S.expanded.add(t.dataset.fold); const w = $('diffwrap'), st = w ? w.scrollTop : 0; renderCode(S.pairs[S.sel]); if ($('diffwrap')) $('diffwrap').scrollTop = st; }
  else if (t.dataset.goto != null) goTo(+t.dataset.goto);

    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Summary copied'), fallback); else fallback();
  }

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
});

  else if (t.id === 'optFold') { S.opts.fold = t.checked; renderCode(S.pairs[S.sel]); }

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if ((k === 'n' || e.key === 'F8') && !e.shiftKey) { e.preventDefault(); goTo(S.block + 1); }
  else if (k === 'p' || (e.key === 'F8' && e.shiftKey)) { e.preventDefault(); goTo(S.block < 0 ? S.blocks - 1 : S.block - 1); }
  else if (k === 'j' || k === 'k') {

    let ix = vis.findIndex(p => p.i === S.sel); ix = k === 'j' ? Math.min(vis.length - 1, ix + 1) : Math.max(0, ix - 1);

  }
});
